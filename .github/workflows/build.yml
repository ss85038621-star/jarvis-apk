name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - name: Python deps
        run: pip install buildozer cython==0.29.36 virtualenv
      - name: Build
        run: buildozer android debug > build.log 2>&1
      - name: Show error
        if: failure()
        run: tail -n 80 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: bin/*.apk
