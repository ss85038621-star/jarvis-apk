name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - name: Python deps
        run: pip install buildozer cython==0.29.36 virtualenv
      - name: Build
        run: buildozer android debug > build.log 2>&1
      - name: Show error
        if: failure()
        run: |
          grep -n -i -E "error|fatal|failed|no such|not found" build.log | grep -v -i "warning" | tail -n 30
          echo =========
          tail -n 260 build.log | head -n 120
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: bin/*.apk
